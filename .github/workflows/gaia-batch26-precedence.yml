name: Gaia Master Batch 26 Precedence

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_batch26_production_precedence_06350.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/batch26_stage_06350.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_06350_batch26_final.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_06100_hybrid_accent_b1_READABLE.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH20_EXACT_OFFSET_0.6.29.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH24_EXACT_OFFSET_0.6.33.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH25_NEW_EXACT_OFFSET_0.6.34.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/GAMEPLAY_ACCENT_OVERRIDES_0.6.11.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH3_FALLBACK_ACCENT_MAP_0.6.12.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/COMPACT_TRANSLATION_OVERRIDES_0.6.13.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/COMPACT_TRANSLATION_OVERRIDES_0.6.14.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/COMPACT_TRANSLATION_OVERRIDES_0.6.14.1.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/DYNAMIC_LITERAL_OVERRIDES_0.6.14.0.csv"
      - ".github/workflows/gaia-batch26-precedence.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit final production precedence
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_batch26_production_precedence_06350.py
      - name: Selftest real source staging and restoration
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/batch26_stage_06350.py
      - name: Selftest final production builder contract
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_06350_batch26_final.py --selftest
      - name: Persist audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.35.0/BATCH26_PRECEDENCE_AUDIT.txt
          if ! git diff --cached --quiet; then
            git commit -m "Gaia Master 0.6.35.0: store Batch26 precedence audit"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
