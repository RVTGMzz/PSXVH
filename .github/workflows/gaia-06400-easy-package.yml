name: Gaia Master 0.6.40.0 EASY Package

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - ".github/workflows/gaia-06400-easy-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare EASY package
        shell: bash
        run: |
          ROOT="games/GaiaMaster-Kamigami-no-Board-Game"
          PKG="GaiaMaster_0.6.40.0_Batch30_EASY"
          mkdir -p "$PKG/Core"
          cp -a "$ROOT"/. "$PKG/Core"/
          find "$PKG/Core" -type f \( -iname '*.bin' -o -iname '*.cue' -o -iname '*.iso' -o -iname '*.img' -o -iname '*.chd' \) -delete
          cat > "$PKG/00_VIET_HOA_GAME.cmd" <<'EOF'
          @echo off
          setlocal EnableExtensions
          chcp 65001 >nul
          title Gaia Master 0.6.40.0 - Viet Hoa
          set "CLEAN_SHA=F4D5298583C90D89C4B7E51D2DDE160EE07F2AEC"
          echo ============================================================
          echo       GAIA MASTER 0.6.40.0 - VIET HOA BATCH 30
          echo ============================================================
          echo.
          set "BIN=%~1"
          if not defined BIN (
            for /f "usebackq delims=" %%F in (`powershell -NoProfile -Command "$sha='%CLEAN_SHA%'; Get-ChildItem -LiteralPath '%~dp0' -Filter '*.bin' -File ^| Where-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA1).Hash -eq $sha } ^| Select-Object -First 1 -ExpandProperty FullName"`) do set "BIN=%%F"
          )
          if not defined BIN (
            echo [!] Khong tim thay CLEAN Japan BIN dung SHA1 trong thu muc nay.
            echo.
            echo Hay chep CLEAN Japan .BIN vao cung thu muc voi file nay,
            echo roi bam dup 00_VIET_HOA_GAME.cmd.
            echo.
            echo SHA1 can dung:
            echo %CLEAN_SHA%
            echo.
            pause
            exit /b 2
          )
          echo CLEAN BIN:
          echo "%BIN%"
          echo.
          where py >nul 2>&1
          if %errorlevel%==0 (
            py -3 "%~dp0Core\tools\build_gaia_06400_batch30_accent_sweep.py" "%BIN%"
          ) else (
            python "%~dp0Core\tools\build_gaia_06400_batch30_accent_sweep.py" "%BIN%"
          )
          set "RC=%errorlevel%"
          echo.
          if "%RC%"=="0" (
            echo ============================================================
            echo  XONG! Build 0.6.40.0 thanh cong.
            echo  Hay mo dung file CUE/BIN co ten 0.6.40.0.
            echo  Gui lai GaiaMaster_0.6.40.0_BATCH30_FINAL_REPORT.txt.
            echo ============================================================
          ) else (
            echo [LOI] Build chua thanh cong. Ma loi: %RC%
            echo Chup cua so nay gui lai de kiem tra.
          )
          echo.
          pause
          exit /b %RC%
          EOF
          cat > "$PKG/01_QUET_TOAN_BO_GAME.cmd" <<'EOF'
          @echo off
          setlocal EnableExtensions
          chcp 65001 >nul
          title Gaia Master 0.6.38.0 - Quet toan bo text Nhat
          set "CLEAN_SHA=F4D5298583C90D89C4B7E51D2DDE160EE07F2AEC"
          echo ============================================================
          echo       GAIA MASTER - QUET TOAN BO TEXT NHAT TRONG GAME
          echo ============================================================
          echo.
          set "BIN=%~1"
          if not defined BIN (
            for /f "usebackq delims=" %%F in (`powershell -NoProfile -Command "$sha='%CLEAN_SHA%'; Get-ChildItem -LiteralPath '%~dp0' -Filter '*.bin' -File ^| Where-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA1).Hash -eq $sha } ^| Select-Object -First 1 -ExpandProperty FullName"`) do set "BIN=%%F"
          )
          if not defined BIN (
            echo [!] Khong tim thay CLEAN Japan BIN dung SHA1.
            echo Chep CLEAN Japan .BIN vao cung thu muc roi chay lai.
            echo.
            pause
            exit /b 2
          )
          where py >nul 2>&1
          if %errorlevel%==0 (
            py -3 "%~dp0Core\tools\scan_full_japanese_text_06380.py" "%BIN%"
          ) else (
            python "%~dp0Core\tools\scan_full_japanese_text_06380.py" "%BIN%"
          )
          set "RC=%errorlevel%"
          echo.
          if "%RC%"=="0" (
            echo QUET XONG. Gui lai 2 file:
            echo GaiaMaster_0.6.38.0_FULL_JAPANESE_SCAN.csv
            echo GaiaMaster_0.6.38.0_FULL_JAPANESE_SCAN_REPORT.txt
          ) else (
            echo [LOI] Quet chua thanh cong. Ma loi: %RC%
          )
          echo.
          pause
          exit /b %RC%
          EOF
          cat > "$PKG/02_DOC_TRUOC.txt" <<'EOF'
          GAIA MASTER 0.6.40.0 - BATCH 30 EASY
          =====================================

          CHI CO 2 NUT CAN QUAN TAM:

          1) 00_VIET_HOA_GAME.cmd
             - Build ban Viet hoa 0.6.40.0.
             - Tu dong tim DUNG CLEAN BIN bang SHA1.
             - Sau build, mo dung output co ten 0.6.40.0.

          2) 01_QUET_TOAN_BO_GAME.cmd
             - Quet text Nhat chua tung vao Translation Master.
             - READ ONLY, khong sua ROM.
             - Sau khi quet xong gui lai CSV + REPORT de tiep tuc dich Story/Tutorial.

          CACH DUNG:
          - Chep CLEAN Japan BIN vao CUNG thu muc nay.
          - Bam 00_VIET_HOA_GAME.cmd de build.
          - Bam 01_QUET_TOAN_BO_GAME.cmd de quet text Nhat toan game.
          - Khong can mo thu muc Core.

          CLEAN BIN SHA1:
          f4d5298583c90d89c4b7e51d2dde160ee07f2aec

          0.6.40.0 build contract:
          - 282 exact targets moi staged
          - 295 exact fields phai byte-verify
          - legacy gate 397/397
          - frozen 60-glyph codepage
          - chua goi Runtime PASS cho toi khi xem screenshot/log that

          Goi nay KHONG kem ROM/game goc.
          EOF
          chmod -R a+rX "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: GaiaMaster_0.6.40.0_Batch30_EASY
          path: GaiaMaster_0.6.40.0_Batch30_EASY
          if-no-files-found: error
