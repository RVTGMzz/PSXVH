name: Gaia Master Batch 24 Manifest

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch24_exact_manifest_06330.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH21_SEMANTIC_0.6.30.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH22_COMPACT_0.6.31.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH23_COMPACT_0.6.32.0.csv"
      - ".github/workflows/gaia-batch24-manifest.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile exact residual manifest
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch24_exact_manifest_06330.py
      - name: Persist manifest and validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH24_EXACT_OFFSET_0.6.33.0.csv
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.33.0/BATCH24_MANIFEST_VALIDATION.txt
          if ! git diff --cached --quiet; then
            git commit -m "Gaia Master 0.6.33.0: store Batch 24 residual exact manifest"
            git push
          fi
