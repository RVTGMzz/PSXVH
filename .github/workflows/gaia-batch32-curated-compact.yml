name: Gaia Master Batch 32 Curated Compact

on:
  push:
    branches:
      - gaia-character-select-font-atlas-reverse-01
    paths:
      - 'games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch32_curated_compact_06420.py'
      - 'games/GaiaMaster-Kamigami-no-Board-Game/translation/**'
      - '.github/workflows/gaia-batch32-curated-compact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile curated compact exact rows
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch32_curated_compact_06420.py
      - name: Persist Batch32 outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH32_CURATED_COMPACT_0.6.42.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.42.0/BATCH32_CURATED_COMPACT_REPORT.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Gaia Master 0.6.42.0: persist Batch32 curated compact sweep"
            git push
          fi
