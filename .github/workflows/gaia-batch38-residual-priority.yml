name: Gaia Master Batch 38 Residual Priority

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch38_residual_priority_06480.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH37_FINAL_EXACT_SET_0.6.47.0.csv"
      - ".github/workflows/gaia-batch38-residual-priority.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build post-Batch36 residual inventory
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch38_residual_priority_06480.py
      - name: Persist Batch38 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH38_RESIDUAL_PRIORITY_0.6.48.0.csv
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.48.0/BATCH38_RESIDUAL_PRIORITY_REPORT.txt
          if git diff --cached --quiet; then echo "No Batch38 output changes"; else git commit -m "Gaia Master 0.6.48.0: persist Batch38 residual inventory" && git push; fi
