name: Gaia Master Batch 33 Merge

on:
  push:
    branches:
      - gaia-character-select-font-atlas-reverse-01
    paths:
      - 'games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch33_merge_06430.py'
      - 'games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH29_NEW_EXACT_OFFSET_0.6.39.0.csv'
      - 'games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH29_FINAL_EXACT_SET_0.6.39.0.csv'
      - 'games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH32_CURATED_COMPACT_0.6.42.0.csv'
      - '.github/workflows/gaia-batch33-merge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge exact manifests
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch33_merge_06430.py
      - name: Persist Batch33 outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH33_NEW_EXACT_OFFSET_0.6.43.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH33_FINAL_EXACT_SET_0.6.43.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.43.0/BATCH33_MERGE_REPORT.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Gaia Master 0.6.43.0: persist Batch33 merged exact manifest"
            git push
          fi
