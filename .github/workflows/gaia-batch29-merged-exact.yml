name: Gaia Master Batch 29 Merged Exact

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch29_merged_exact_06390.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH20_EXACT_OFFSET_0.6.29.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH24_EXACT_OFFSET_0.6.33.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH27_ACCENT_PROMOTION_0.6.36.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH28_SAME_ROW_ACCENT_0.6.37.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/COMPACT_TRANSLATION_OVERRIDES_0.6.14.1.csv"
      - ".github/workflows/gaia-batch29-merged-exact.yml"

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Merge and validate final exact set
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch29_merged_exact_06390.py
      - name: Persist Batch29 outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH29_NEW_EXACT_OFFSET_0.6.39.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH29_FINAL_EXACT_SET_0.6.39.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.39.0/BATCH29_MERGE_VALIDATION.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Gaia Master 0.6.39.0: persist Batch29 exact merge"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
