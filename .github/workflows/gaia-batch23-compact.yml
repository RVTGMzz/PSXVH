name: Gaia Master Batch 23 Compact

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH23_COMPACT_0.6.32.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/validate_batch23_compact_06320.py"
      - ".github/workflows/gaia-batch23-compact.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate compact remainder
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/validate_batch23_compact_06320.py
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.32.0/BATCH23_VALIDATION.txt
          if ! git diff --cached --quiet; then
            git commit -m "Gaia Master 0.6.32.0: store Batch 23 compact validation"
            git push
          fi
