name: Gaia Master Batch 37 Merge

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch37_merge_06470.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH36_CURATED_COMPACT_0.6.46.0.csv"
      - ".github/workflows/gaia-batch37-merge.yml"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Merge Batch37 exact manifests
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch37_merge_06470.py
      - name: Persist Batch37 outputs
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH37_NEW_EXACT_OFFSET_0.6.47.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH37_FINAL_EXACT_SET_0.6.47.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.47.0/BATCH37_MERGE_REPORT.txt || true
          if git diff --cached --quiet; then echo "No Batch37 output changes"; else git commit -m "Gaia Master 0.6.47.0: persist Batch37 large merge" && git push; fi
