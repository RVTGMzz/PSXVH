name: Gaia Master 0.6.35.0 Package

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - ".github/workflows/gaia-batch26-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Batch26 build-ready package
        uses: actions/upload-artifact@v4
        with:
          name: GaiaMaster_0.6.35.0_Batch26_BUILD_READY
          path: games/GaiaMaster-Kamigami-no-Board-Game
          if-no-files-found: error
          include-hidden-files: false
