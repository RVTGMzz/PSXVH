name: Gaia Master B51R1 Static Validation

on:
  workflow_dispatch:
  push:
    branches:
      - gaia-character-select-font-atlas-reverse-01
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_b51_guarded_exact_overlay.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_b51r1_guarded_exact_overlay.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/validate_gaia_b51_static.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_06100_hybrid_accent_b1_LEGACY.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/batch40_stage_06500.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/batch29_stage_06390.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/source_layer/checkpoint_B50/**"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/source_layer/B51_RUNTIME_CHARSET_CORRECTIONS.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH40_FINAL_EXACT_SET_0.6.50.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH43_WHOLEGAME_VISIBLE_0.6.53.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/TRANSLATION_MASTER_0.6_part*.csv"
      - ".github/workflows/gaia-b51-static-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check B51R1 tools
        run: |
          python -m py_compile games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_b51_guarded_exact_overlay.py
          python -m py_compile games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_b51r1_guarded_exact_overlay.py
          python -m py_compile games/GaiaMaster-Kamigami-no-Board-Game/tools/validate_gaia_b51_static.py

      - name: Run B51R1 static checkpoint validator
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/validate_gaia_b51_static.py

      - name: Upload static validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GaiaMaster-B51R1-Static-Validation
          path: games/GaiaMaster-Kamigami-no-Board-Game/translation/source_layer/checkpoint_B51/STATIC_VALIDATION.txt
          if-no-files-found: error
