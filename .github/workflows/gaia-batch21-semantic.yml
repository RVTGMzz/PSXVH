name: Gaia Master Batch 21 Semantic

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH21_SEMANTIC_0.6.30.0.csv"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/validate_batch21_semantic_06300.py"
      - ".github/workflows/gaia-batch21-semantic.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate semantic map
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/validate_batch21_semantic_06300.py
      - name: Persist validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.30.0/BATCH21_SEMANTIC_VALIDATION.txt
          if ! git diff --cached --quiet; then
            git commit -m "Gaia Master 0.6.30.0: store Batch 21 semantic validation"
            git push
          fi
