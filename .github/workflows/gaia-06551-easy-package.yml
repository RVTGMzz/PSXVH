name: Gaia Master 0.6.55.1 Batch45R2 EASY Package

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - ".github/workflows/gaia-06551-easy-package.yml"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_gaia_06551_batch45r2_font_micro_polish.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/find_clean_bin_06551.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/package_launcher_06551.cmd"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/package_root_launcher_06551.cmd"
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/00_BUILD_0.6.55.1_BATCH45R2_FONT_POLISH.cmd"
      - "games/GaiaMaster-Kamigami-no-Board-Game/BATCH45R2_0.6.55.1_FONT_MICRO_POLISH.md"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and static selftest
        shell: bash
        run: |
          set -euo pipefail
          ROOT="games/GaiaMaster-Kamigami-no-Board-Game"
          python -m py_compile "$ROOT/tools/build_gaia_06551_batch45r2_font_micro_polish.py"
          python -m py_compile "$ROOT/tools/find_clean_bin_06551.py"
          python "$ROOT/tools/build_gaia_06551_batch45r2_font_micro_polish.py" --selftest

          python - <<'PY'
          from pathlib import Path
          root = Path("games/GaiaMaster-Kamigami-no-Board-Game/tools")
          for name in ("package_root_launcher_06551.cmd", "package_launcher_06551.cmd"):
              data = (root / name).read_bytes()
              assert all(b < 128 for b in data), (name, "non-ASCII byte")
              assert b"\r\n" in data, (name, "missing CRLF")
          print("Windows launcher byte-format gates: PASS")
          PY

      - name: Prepare EASY package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="games/GaiaMaster-Kamigami-no-Board-Game"
          PKG="GaiaMaster_0.6.55.1_Batch45R2_FONT_EASY"
          mkdir -p "$PKG/Core"
          cp -a "$ROOT"/. "$PKG/Core"/
          find "$PKG/Core" -type f \( -iname '*.bin' -o -iname '*.cue' -o -iname '*.iso' -o -iname '*.img' -o -iname '*.chd' \) -delete

          cp "$ROOT/tools/package_root_launcher_06551.cmd" "$PKG/00_VIET_HOA_GAME.cmd"

          cat > "$PKG/01_DOC_TRUOC.txt" <<'EOF'
          GAIA MASTER 0.6.55.1 - BATCH45R2 FONT MICRO POLISH
          ==================================================

          QUAN TRONG:
          1. GIAI NEN TOAN BO ZIP ra mot thu muc binh thuong.
          2. Chep CLEAN Japan BIN vao CUNG thu muc voi 00_VIET_HOA_GAME.cmd.
          3. Double-click 00_VIET_HOA_GAME.cmd.
          4. Cua so launcher moi se LUON pause khi ket thuc hoac gap loi.

          Launcher moi:
          - root CMD chi call Core/tools/package_launcher_06551.cmd;
          - khong dung PowerShell;
          - CMD la ASCII + CRLF;
          - Python finder tim CLEAN BIN bang SHA1;
          - builder tu check CLEAN SHA1 lan nua.

          Font target:
          - lowercase d-stroke: anchor to the actual right stem;
          - uppercase D-stroke: separate left-stem rule;
          - circumflex/breve raised for more breathing room;
          - stacked tone marks use a separate lane.

          CLEAN BIN SHA1:
          f4d5298583c90d89c4b7e51d2dde160ee07f2aec

          Static/build PASS is NOT Runtime PASS.
          Gameplay screenshots are still required.
          This package does not include the original game ROM.
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path("GaiaMaster_0.6.55.1_Batch45R2_FONT_EASY/00_VIET_HOA_GAME.cmd")
          data = p.read_bytes()
          assert all(b < 128 for b in data)
          assert b"\r\n" in data
          assert b"powershell" not in data.lower()
          print("Packaged root launcher gates: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: GaiaMaster_0.6.55.1_Batch45R2_FONT_EASY
          path: GaiaMaster_0.6.55.1_Batch45R2_FONT_EASY
          if-no-files-found: error
