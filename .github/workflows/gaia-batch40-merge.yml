name: Gaia Master Batch 40 Closure Merge

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch40_merge_06500.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH39_MASTER_CLOSURE_0.6.49.0.csv"
      - ".github/workflows/gaia-batch40-merge.yml"
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Merge Batch40 closure manifests
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch40_merge_06500.py
      - name: Persist Batch40 outputs
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH40_NEW_EXACT_OFFSET_0.6.50.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH40_FINAL_EXACT_SET_0.6.50.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.50.0/BATCH40_MERGE_REPORT.txt || true
          if git diff --cached --quiet; then echo "No Batch40 output changes"; else git commit -m "Gaia Master 0.6.50.0: persist Batch40 closure merge" && git push; fi
