name: Gaia Master 596 Source Review Audit

on:
  push:
    branches:
      - gaia-character-select-font-atlas-reverse-01
    paths:
      - 'games/GaiaMaster-Kamigami-no-Board-Game/translation/**'
      - 'games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_*_20260915.py'
      - 'games/GaiaMaster-Kamigami-no-Board-Game/tools/materialize_master_source_review_596_20260915.py'
      - '.github/workflows/gaia-source-review-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-review-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile source-review tools
        run: |
          python -m py_compile \
            games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_part01_source_review_20260915.py \
            games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_part02_source_review_20260915.py \
            games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_part04_source_review_20260915.py \
            games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_master_source_review_596_20260915.py \
            games/GaiaMaster-Kamigami-no-Board-Game/tools/materialize_master_source_review_596_20260915.py

      - name: Audit all 596 Translation Master source rows
        shell: bash
        run: |
          set -o pipefail
          python games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_master_source_review_596_20260915.py \
            2>&1 | tee GAIA_SOURCE_REVIEW_AUDIT.log

      - name: Dry-run materialization
        shell: bash
        run: |
          set -o pipefail
          python games/GaiaMaster-Kamigami-no-Board-Game/tools/materialize_master_source_review_596_20260915.py \
            2>&1 | tee GAIA_MASTER_596_MATERIALIZE_DRYRUN.log

      - name: Materialize reviewed vi_full in CI checkout
        shell: bash
        run: |
          set -o pipefail
          python games/GaiaMaster-Kamigami-no-Board-Game/tools/materialize_master_source_review_596_20260915.py --write \
            2>&1 | tee GAIA_MASTER_596_MATERIALIZE_WRITE.log

      - name: Re-audit after materialization
        shell: bash
        run: |
          set -o pipefail
          python games/GaiaMaster-Kamigami-no-Board-Game/tools/audit_master_source_review_596_20260915.py \
            2>&1 | tee GAIA_SOURCE_REVIEW_POSTWRITE_AUDIT.log

      - name: Commit verified Translation Master vi_full
        shell: bash
        run: |
          set -euo pipefail
          PREFIX='games/GaiaMaster-Kamigami-no-Board-Game/translation/TRANSLATION_MASTER_0.6_part'

          unexpected="$(git diff --name-only | grep -Ev '^games/GaiaMaster-Kamigami-no-Board-Game/translation/TRANSLATION_MASTER_0\.6_part0[1-6]\.csv$' || true)"
          if [ -n "$unexpected" ]; then
            echo '[BLOCKED] Unexpected tracked files changed by materialization:'
            echo "$unexpected"
            exit 1
          fi

          if git diff --quiet -- "${PREFIX}"*.csv; then
            echo 'Translation Master already materialized; nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${PREFIX}"*.csv
          git commit -m 'Gaia Master: materialize 596 reviewed source translations'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload source-review logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GaiaMaster_596_Source_Review_Audit_Log
          path: |
            GAIA_SOURCE_REVIEW_AUDIT.log
            GAIA_MASTER_596_MATERIALIZE_DRYRUN.log
            GAIA_MASTER_596_MATERIALIZE_WRITE.log
            GAIA_SOURCE_REVIEW_POSTWRITE_AUDIT.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload materialized Translation Master
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GaiaMaster_596_Source_Reviewed_Master
          path: games/GaiaMaster-Kamigami-no-Board-Game/translation/TRANSLATION_MASTER_0.6_part*.csv
          if-no-files-found: error
          retention-days: 30
