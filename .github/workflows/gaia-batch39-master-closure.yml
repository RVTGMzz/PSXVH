name: Gaia Master Batch 39 Master Closure

on:
  workflow_dispatch:
  push:
    branches: [gaia-character-select-font-atlas-reverse-01]
    paths:
      - "games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch39_master_closure_06490.py"
      - "games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH37_FINAL_EXACT_SET_0.6.47.0.csv"
      - ".github/workflows/gaia-batch39-master-closure.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Batch39 master residual closure
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch39_master_closure_06490.py
      - name: Persist Batch39 outputs
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH39_MASTER_CLOSURE_0.6.49.0.csv || true
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.49.0/BATCH39_MASTER_CLOSURE_REPORT.txt || true
          if git diff --cached --quiet; then echo "No Batch39 output changes"; else git commit -m "Gaia Master 0.6.49.0: persist Batch39 master closure" && git push; fi
