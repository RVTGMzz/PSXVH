name: Gaia Master Batch 31 Residual Priority

on:
  push:
    branches:
      - gaia-character-select-font-atlas-reverse-01
    paths:
      - 'games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch31_residual_alpha_priority_06410.py'
      - 'games/GaiaMaster-Kamigami-no-Board-Game/translation/**'
      - '.github/workflows/gaia-batch31-residual-priority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build residual priority inventory
        run: python games/GaiaMaster-Kamigami-no-Board-Game/tools/build_batch31_residual_alpha_priority_06410.py
      - name: Persist Batch31 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/GaiaMaster-Kamigami-no-Board-Game/translation/BATCH31_RESIDUAL_ALPHA_PRIORITY_0.6.41.0.csv
          git add games/GaiaMaster-Kamigami-no-Board-Game/checkpoints/0.6.41.0/BATCH31_RESIDUAL_ALPHA_PRIORITY_REPORT.txt
          if ! git diff --cached --quiet; then
            git commit -m "Gaia Master 0.6.41.0: persist Batch31 residual priority inventory"
            git push
          fi
